name: 공시 확인

on:
  schedule:
    - cron: '17 */2 * * *' # 2시간마다
  workflow_dispatch: {} # Actions 탭에서 직접 실행 가능

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node alerts.mjs
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain alerts.json)" ]; then
            git config user.name "kkujun-bot"
            git config user.email "actions@users.noreply.github.com"
            git add alerts.json
            git commit -m "공시 갱신"
            git push
          fi
